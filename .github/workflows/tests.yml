name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.5'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update -W --prefer-dist --no-interaction --with="laravel/framework:${{ matrix.laravel }}" --with="orchestra/testbench:${{ matrix.testbench }}" --with="phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Run tests
        run: composer test
